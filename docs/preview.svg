<svg xmlns="http://www.w3.org/2000/svg" width="640" height="300" viewBox="0 0 640 300" role="img" aria-label="Sidebar with an expanded themed category block of nested Workspace cards, a collapsed category block, the Uncategorized row, and a close-up of the category menu plus the seven Finder tag colors">
  <title>Workspace categories and blocks</title>

  <!-- Everything is drawn with neutral translucent fills and a single accent
       per category, so the illustration reads the same on a light page and on
       a dark page. -->

  <!-- ============ Sidebar ============ -->
  <rect x="28" y="18" width="332" height="264" rx="18" fill="rgba(127,127,127,0.10)" stroke="rgba(127,127,127,0.32)"/>

  <!-- Section header: label, view options, add workspace, then the new category button -->
  <rect x="46" y="36" width="72" height="8" rx="4" fill="rgba(127,127,127,0.55)"/>
  <rect x="248" y="30" width="24" height="22" rx="7" fill="rgba(127,127,127,0.20)"/>
  <g fill="none" stroke="rgba(127,127,127,0.72)" stroke-width="1.5" stroke-linecap="round">
    <path d="M255 37h10M255 41h10M255 45h6"/>
  </g>
  <rect x="280" y="30" width="24" height="22" rx="7" fill="rgba(127,127,127,0.20)"/>
  <g fill="none" stroke="rgba(127,127,127,0.72)" stroke-width="1.5" stroke-linecap="round">
    <path d="M292 35.5v11M286.5 41h11"/>
  </g>
  <!-- The new category button, immediately right of it: highlighted. -->
  <rect x="312" y="28" width="28" height="26" rx="8" fill="rgba(124,108,245,0.22)" stroke="rgba(124,108,245,0.80)" stroke-width="1.4"/>
  <g fill="none" stroke="#7C6CF5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="317.5" y="39.5" width="13" height="9" rx="2.4"/>
    <path d="M321.5 42.5h5M321.5 45h3.4"/>
    <path d="M333.5 34.4v4.4M331.3 36.6h4.4"/>
  </g>

  <!-- ============ Expanded category block (violet) ============ -->
  <!-- One tinted rounded container; the title and the member cards are layers on top of it. -->
  <rect x="40" y="64" width="308" height="114" rx="16" fill="rgba(124,108,245,0.16)" stroke="rgba(124,108,245,0.52)" stroke-width="1.2"/>

  <!-- The title itself is transparent: the block colour shows through it. -->
  <rect x="40" y="64" width="3" height="30" rx="1.5" fill="#7C6CF5"/>
  <g fill="rgba(127,127,127,0.55)">
    <circle cx="53" cy="74" r="1.4"/><circle cx="57" cy="74" r="1.4"/>
    <circle cx="53" cy="79" r="1.4"/><circle cx="57" cy="79" r="1.4"/>
    <circle cx="53" cy="84" r="1.4"/><circle cx="57" cy="84" r="1.4"/>
  </g>
  <path d="M64.6 77.4l3.4 3.4 3.4-3.4z" fill="rgba(127,127,127,0.80)"/>
  <circle cx="82" cy="79" r="4" fill="#7C6CF5"/>
  <rect x="92" y="75" width="76" height="8" rx="4" fill="rgba(127,127,127,0.62)"/>
  <rect x="284" y="72.5" width="26" height="13" rx="6.5" fill="rgba(124,108,245,0.30)"/>
  <rect x="290" y="76" width="14" height="6" rx="3" fill="rgba(127,127,127,0.55)"/>
  <g fill="rgba(127,127,127,0.75)">
    <circle cx="321" cy="79" r="1.3"/><circle cx="326" cy="79" r="1.3"/><circle cx="331" cy="79" r="1.3"/>
  </g>
  <rect x="40" y="93.6" width="308" height="0.8" fill="rgba(124,108,245,0.42)"/>

  <!-- Member card 1: an expanded Workspace with two Session rows. -->
  <rect x="44" y="98" width="300" height="40" rx="12" fill="rgba(127,127,127,0.16)" stroke="rgba(127,127,127,0.34)"/>
  <path d="M53 106.5h5l1.8 2.2h5.4a2 2 0 0 1 2 2v1.3H53z" fill="rgba(124,108,245,0.85)"/>
  <rect x="74" y="107.5" width="96" height="8" rx="4" fill="rgba(127,127,127,0.60)"/>
  <rect x="322" y="108.5" width="14" height="6" rx="3" fill="rgba(127,127,127,0.34)"/>
  <circle cx="57" cy="127" r="2.6" fill="rgba(127,127,127,0.46)"/>
  <rect x="65" y="124.8" width="70" height="4.4" rx="2.2" fill="rgba(127,127,127,0.42)"/>
  <circle cx="57" cy="135" r="2.6" fill="rgba(127,127,127,0.46)"/>
  <rect x="65" y="132.8" width="104" height="4.4" rx="2.2" fill="rgba(127,127,127,0.42)"/>

  <!-- Member card 2: a folded Workspace. -->
  <rect x="44" y="142" width="300" height="28" rx="12" fill="rgba(127,127,127,0.14)" stroke="rgba(127,127,127,0.32)"/>
  <path d="M53 151h5l1.8 2.2h5.4a2 2 0 0 1 2 2v1.3H53z" fill="rgba(124,108,245,0.85)"/>
  <rect x="74" y="152" width="84" height="8" rx="4" fill="rgba(127,127,127,0.56)"/>

  <!-- ============ Collapsed category block (teal) ============ -->
  <rect x="40" y="186" width="308" height="30" rx="16" fill="rgba(47,182,198,0.16)" stroke="rgba(47,182,198,0.52)" stroke-width="1.2"/>
  <rect x="40" y="186" width="3" height="30" rx="1.5" fill="#2FB6C6"/>
  <g fill="rgba(127,127,127,0.55)">
    <circle cx="53" cy="196" r="1.4"/><circle cx="57" cy="196" r="1.4"/>
    <circle cx="53" cy="201" r="1.4"/><circle cx="57" cy="201" r="1.4"/>
    <circle cx="53" cy="206" r="1.4"/><circle cx="57" cy="206" r="1.4"/>
  </g>
  <path d="M66 197.4l4 3.6-4 3.6z" fill="rgba(127,127,127,0.80)"/>
  <circle cx="82" cy="201" r="4" fill="#2FB6C6"/>
  <rect x="92" y="197" width="62" height="8" rx="4" fill="rgba(127,127,127,0.58)"/>
  <rect x="284" y="194.5" width="26" height="13" rx="6.5" fill="rgba(47,182,198,0.28)"/>
  <rect x="290" y="198" width="14" height="6" rx="3" fill="rgba(127,127,127,0.50)"/>

  <!-- ============ Uncategorized tail ============ -->
  <rect x="46" y="232" width="86" height="0.8" fill="rgba(127,127,127,0.30)"/>
  <rect x="140" y="228.5" width="56" height="7" rx="3.5" fill="rgba(127,127,127,0.45)"/>
  <rect x="204" y="232" width="140" height="0.8" fill="rgba(127,127,127,0.30)"/>
  <rect x="40" y="242" width="308" height="30" rx="16" fill="rgba(127,127,127,0.10)" stroke="rgba(127,127,127,0.26)"/>
  <path d="M53 251.5h5l1.8 2.2h5.4a2 2 0 0 1 2 2v1.3H53z" fill="rgba(127,127,127,0.60)"/>
  <rect x="74" y="252.5" width="88" height="8" rx="4" fill="rgba(127,127,127,0.52)"/>

  <!-- ============ Close-up: the category menu ============ -->
  <rect x="380" y="34" width="204" height="106" rx="16" fill="rgba(56,57,62,0.62)" stroke="rgba(127,127,127,0.42)"/>
  <!-- Rename row: the shipped edit-outline icon -->
  <g fill="none" stroke="rgba(238,240,244,0.88)" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M395.9 41.2h-4.7a2.5 2.5 0 0 0-2.5 2.5v7.6a2.5 2.5 0 0 0 2.5 2.5h7.6a2.5 2.5 0 0 0 2.5-2.5v-3.9h1"/>
    <path d="M394.8 46.7 400.9 40.6"/>
  </g>
  <rect x="408" y="44" width="46" height="8" rx="4" fill="rgba(238,240,244,0.86)"/>
  <!-- Separator -->
  <rect x="394" y="66.5" width="178" height="0.5" fill="rgba(238,240,244,0.26)"/>
  <!-- Delete row: the shipped trash-outline icon, in the danger colour -->
  <g fill="none" stroke="#EF4B4B" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
    <path d="M390.8 76.4h13.4"/>
    <path d="M394.9 76.4v-1.4c0-.5.4-1 1-1h2.3c.6 0 1 .4 1 1v1.4"/>
    <path d="M392 76.4l.6 9.4c0 .5.4.9 1 .9h5.5c.5 0 1-.4 1-.9l.6-9.4"/>
    <path d="M396.4 79.5v4.1M399.5 79.5v4.1"/>
  </g>
  <rect x="408" y="78" width="64" height="8" rx="4" fill="rgba(239,75,75,0.88)"/>

  <!-- ============ Close-up: the Finder tag palette ============ -->
  <rect x="380" y="150" width="204" height="86" rx="16" fill="rgba(56,57,62,0.62)" stroke="rgba(127,127,127,0.42)"/>
  <rect x="394" y="162" width="40" height="6" rx="3" fill="rgba(238,240,244,0.45)"/>
  <g>
    <rect x="394" y="180" width="18" height="18" rx="9" fill="#FF6366"/>
    <rect x="421" y="180" width="18" height="18" rx="9" fill="#FEA65D"/>
    <rect x="448" y="180" width="18" height="18" rx="9" fill="#FFD552"/>
    <rect x="475" y="180" width="18" height="18" rx="9" fill="#69D27E"/>
    <rect x="502" y="180" width="18" height="18" rx="9" fill="#48A1FF"/>
    <rect x="529" y="180" width="18" height="18" rx="9" fill="#D55BE4"/>
    <rect x="556" y="180" width="18" height="18" rx="9" fill="#A5A5A9"/>
  </g>
  <!-- The selected colour carries the same ring the panel draws. -->
  <circle cx="484" cy="189" r="12.5" fill="none" stroke="rgba(238,240,244,0.92)" stroke-width="1.6"/>
  <!-- Existing categories are listed above the palette by their dot colour. -->
  <circle cx="396" cy="216" r="4" fill="#7C6CF5"/>
  <circle cx="412" cy="216" r="4" fill="#2FB6C6"/>
  <rect x="424" y="212.5" width="58" height="7" rx="3.5" fill="rgba(238,240,244,0.42)"/>

</svg>
