# Bundle patch for @local/dsh-workspace-categories.
#
# One Host row. The feature lives entirely in the browser half (`./client`):
# it groups the rendered sidebar Workspace list into themed category blocks and
# draws the per-Workspace highlight cards there. The Host row exists so the
# bundle has a real, enabled plugin entry whose activation owns the Client
# module; its `apply` registers nothing.
- insert:
    - id: dsh-workspace-categories
      name: '@local/dsh-workspace-categories'
