<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Workspace categories">
  <defs>
    <linearGradient id="wsc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2C2657"/>
      <stop offset="1" stop-color="#151826"/>
    </linearGradient>
    <linearGradient id="wsc-violet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9587FF"/>
      <stop offset="1" stop-color="#6C5BF2"/>
    </linearGradient>
    <linearGradient id="wsc-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#55D3E1"/>
      <stop offset="1" stop-color="#2AA8B8"/>
    </linearGradient>
  </defs>

  <!-- Rounded card: the sidebar surface. -->
  <rect width="64" height="64" rx="15" fill="url(#wsc-bg)"/>
  <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="rgba(255,255,255,0.10)"/>

  <!-- Category block 1: tinted container, its title bar, and one member card. -->
  <rect x="11" y="9.5" width="42" height="14.5" rx="6" fill="url(#wsc-violet)" opacity="0.92"/>
  <rect x="11" y="9.5" width="2.2" height="14.5" rx="1.1" fill="#FFFFFF" opacity="0.55"/>
  <rect x="17" y="13" width="14" height="3.4" rx="1.7" fill="#FFFFFF" opacity="0.95"/>
  <rect x="17" y="19" width="30" height="2.6" rx="1.3" fill="#FFFFFF" opacity="0.45"/>

  <!-- Category block 2. -->
  <rect x="11" y="27" width="42" height="14.5" rx="6" fill="url(#wsc-teal)" opacity="0.92"/>
  <rect x="11" y="27" width="2.2" height="14.5" rx="1.1" fill="#FFFFFF" opacity="0.55"/>
  <rect x="17" y="30.5" width="11" height="3.4" rx="1.7" fill="#FFFFFF" opacity="0.95"/>
  <rect x="17" y="36.5" width="24" height="2.6" rx="1.3" fill="#FFFFFF" opacity="0.45"/>

  <!-- Empty category: a dashed drop block with the plus that creates one. -->
  <rect x="11" y="44.5" width="42" height="11" rx="5.5" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.42)" stroke-width="1.2" stroke-dasharray="3.2 2.6"/>
  <g fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round">
    <path d="M32 47.4v5.2"/>
    <path d="M29.4 50h5.2"/>
  </g>
</svg>
